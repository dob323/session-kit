name: Feature request
description: Suggest one focused improvement for the supported Linux beta
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not include real sessions, UUIDs, paths, terminal output, provider content, or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible session-management problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior and how a user would know it works.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy
      description: Explain effects on active sessions, exact identity, provider exit, recovery, cleanup, logs, journals, or retained data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What can users do today, including doing nothing?
    validations:
      required: true
