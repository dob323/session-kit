<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<rect width="1600" height="720" fill="#0d1117"/>
<defs>
  <style>
    .title { font: 700 52px Inter,Arial,sans-serif; fill:#f0f6fc; }
    .sub { font: 400 23px Inter,Arial,sans-serif; fill:#8b949e; }
    .h { font: 600 25px Inter,Arial,sans-serif; fill:#f0f6fc; }
    .p { font: 400 18px Inter,Arial,sans-serif; fill:#8b949e; }
    .mono { font: 500 20px "DejaVu Sans Mono",monospace; fill:#f0f6fc; }
    .small { font: 400 16px Inter,Arial,sans-serif; fill:#8b949e; }
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#9ece6a"/>
  </marker>
</defs>
<text x="70" y="82" class="title">How Session Kit works</text>
<text x="70" y="124" class="sub">Persistence comes from the managed session on the host. Session Kit adds the picker, identity, and guarded actions around it.</text>

<!-- cards -->
<g>
  <rect x="70" y="205" rx="18" ry="18" width="300" height="250" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="98" y="250" class="h">1 · Ordinary shell</text>
  <text x="98" y="294" class="mono">kit</text>
  <text x="98" y="340" class="p">Open the picker only</text>
  <text x="98" y="368" class="p">when you want it.</text>
</g>
<g>
  <rect x="445" y="205" rx="18" ry="18" width="300" height="250" fill="#161b22" stroke="#9ece6a" stroke-width="2"/>
  <text x="473" y="250" class="h">2 · Picker</text>
  <text x="473" y="294" class="p">Choose a stable session</text>
  <text x="473" y="322" class="p">number or start a new one.</text>
  <text x="473" y="370" class="p">Ready and open-elsewhere</text>
  <text x="473" y="398" class="p">sessions stay distinct.</text>
</g>
<g>
  <rect x="820" y="205" rx="18" ry="18" width="300" height="250" fill="#161b22" stroke="#2ac3de" stroke-width="2"/>
  <text x="848" y="250" class="h">3 · shpool session</text>
  <text x="848" y="294" class="p">The managed terminal session</text>
  <text x="848" y="322" class="p">continues on the host.</text>
  <text x="848" y="370" class="p">Claude Code, Codex, or a</text>
  <text x="848" y="398" class="p">shell runs inside it.</text>
</g>
<g>
  <rect x="1195" y="205" rx="18" ry="18" width="335" height="250" fill="#161b22" stroke="#bb9af7" stroke-width="2"/>
  <text x="1223" y="250" class="h">4 · Disconnect / return</text>
  <text x="1223" y="294" class="p">Close the terminal or lose SSH.</text>
  <text x="1223" y="342" class="p">Reconnect later and select</text>
  <text x="1223" y="370" class="p">the same managed session.</text>
</g>

<line x1="370" y1="330" x2="438" y2="330" stroke="#9ece6a" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="745" y1="330" x2="813" y2="330" stroke="#9ece6a" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1120" y1="330" x2="1188" y2="330" stroke="#9ece6a" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="180" y="520" rx="16" ry="16" width="1240" height="112" fill="#21262d" stroke="#30363d"/>
<text x="215" y="562" class="h">What survives?</text>
<text x="215" y="599" class="p">As long as the host stays powered on and awake, the running managed session survives terminal-window and SSH disconnects.</text>
<text x="215" y="626" class="small">A host shutdown or reboot ends the running processes; recoverable provider conversations remain available through Closed sessions.</text>
</svg>