target-version = "py310"

[lint]
# Start with correctness rules that the legacy module can pass without a
# formatting rewrite. Expand this set as code moves into focused modules.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Vendored from Maniple (MIT) — see lib/sessionkit_supervisor/vendor/NOTICE.
# The adaptation keeps upstream's import block intact so the vendored files stay
# diffable against the recorded upstream commit; an unused import there is
# upstream's, not ours, and is not worth a local modification to the notice.
"lib/sessionkit_supervisor/vendor/*" = ["F401"]
